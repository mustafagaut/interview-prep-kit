services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/interview-prep-kit
      PORT: 4000
    depends_on:
      mongo:
        condition: service_started
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  client:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      API_SERVER_URL: http://server:4000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mongo-data: